# Crop-matched control for the tile-scaling benchmark.
# This is identical to era5_2023_m2cond.yaml except for crop and output directory.
data:
  data_path: src/eval/windeval/data/era5_2023.zarr
  crop: 16
  levels: [49, 66]

spacetime: true
conditional: true
n_frames: 4
frame_stride: 1
temporal_kernel: 3

model:
  model_channels: 128
  channel_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [8, 4]
  sigma_data: 1.0

train:
  batch_size: 16
  lr: 2.0e-4
  ema_decay: 0.9999
  n_steps: 100000
  warmup_steps: 1000
  num_workers: 4
  out_dir: runs/idiff_m2cond_crop16
  ckpt_every: 2000
  log_every: 100
  device: cuda
  seed: 0
