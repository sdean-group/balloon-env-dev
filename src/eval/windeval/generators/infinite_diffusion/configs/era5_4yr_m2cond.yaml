# Phase-5 4-YEAR conditional spacetime config — same model/protocol as era5_2023_m2cond,
# trained on 2020-2023 (each year hourly, days 8-14 of every month EXCLUDED; per-year
# zarrs from configs/download_years.sh, time-concatenated in ascending order by data.py).
#
# RAM: 4 years float32 is ~57 GB — over the 64 GB user cap. data_dtype float16 stores
# the arrays at ~28.5 GB (quantization ~0.01 m/s << 8 m/s data std; items are cast back
# to float32 before normalization). **Submit with --mem=64G** (was 48G: job 1034 was
# OOM-killed at 48G before printing a line, because compute_stats used to materialise a
# full-size float64 temporary — 56.9 GB at 4 years, 14.2 GB at 1 year, which is why the
# bug stayed latent. Fixed 2026-08-02 by data._moments_chunked; 64G is headroom, not need.)
#
# Launch (after all of era5_2020/2021/2022.zarr exist):
#   CONFIG=src/eval/windeval/generators/infinite_diffusion/configs/era5_4yr_m2cond.yaml \
#     sbatch --gres=gpu:gpu48:1 --mem=48G -J idiff-m2cond-4yr \
#     src/eval/windeval/generators/infinite_diffusion/configs/train_temporal.sbatch
data:
  data_path:
    - src/eval/windeval/data/era5_2020.zarr
    - src/eval/windeval/data/era5_2021.zarr
    - src/eval/windeval/data/era5_2022.zarr
    - src/eval/windeval/data/era5_2023.zarr
  data_dtype: float16
  crop: 64
  levels: [49, 66]

spacetime: true
conditional: true
n_frames: 4
frame_stride: 1
temporal_kernel: 3

model:
  model_channels: 128
  channel_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [8, 4]
  sigma_data: 1.0

train:
  batch_size: 16                  # *τ(4) = 64 spatial frames -> gpu48 slice
  lr: 2.0e-4
  ema_decay: 0.9999
  n_steps: 500000                 # ~51 h at 2.7 it/s. Chosen (2026-08-02) to match the 4x
                                  # data: the 1-yr run was 300k, and n_steps is RAISABLE
                                  # LATER — resume=true means bumping this and resubmitting
                                  # simply continues from latest.pt, so this is not a
                                  # lock-in. Equally, stop early and score any snapshot.
                                  # Caveat worth watching: on 1 yr, 100k->300k made L_eff
                                  # WORSE (281->421, smoothing) while tails did not move,
                                  # so more steps alone did not help. 4x data is the reason
                                  # to expect different behaviour here — check the 100k and
                                  # 200k snapshots rather than assuming the end is best.
  warmup_steps: 1000
  num_workers: 4
  out_dir: runs/idiff_m2cond_4yr
  ckpt_every: 1000                # latest.pt cadence (≈70-140 min of work at risk)
  snapshot_every: 25000           # 20 × 641 MB ≈ 12.8 GB on quota (was 20000/25 keepers;
                                  # widened because the quota is ~100 GB and 61 GB is used)
  log_every: 100
  device: cuda
  seed: 0
  # W&B: offline because the compute node's egress is UNVERIFIED — an online init can
  # block or fail at step 0 and cost the whole run. Sync from the login node afterwards:
  #   .venv-idiff/bin/wandb sync runs/idiff_m2cond_4yr/wandb/offline-run-*
  # Flip to online only once egress is confirmed. The run id is stored in the checkpoint,
  # so a killed-and-resumed leg re-attaches to ONE continuous loss curve.
  wandb_project: balloon-idiff
  wandb_mode: offline
  wandb_run_name: m2cond-4yr
